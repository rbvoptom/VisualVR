<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>VisualVR - Sesión de Entrenamiento</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <style>
        #overlay {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 999;
            color: white;
            font-family: 'Outfit', sans-serif;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 10px;
            pointer-events: none;
        }

        .exit-btn {
            position: fixed;
            bottom: 20px;
            left: 20px;
            /* Cambiado de right a left */
            z-index: 999;
            background: rgba(255, 0, 0, 0.6);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 12px;
            cursor: pointer;
            display: none;
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
        }
    </style>
</head>

<body>
    <div id="overlay">
        <div id="status">Iniciando...</div>
        <div id="timer">00:00</div>
    </div>

    <button class="exit-btn" id="exit-vr">SALIR</button>

    <a-scene xr-mode-ui="enabled: true" device-orientation-permission-ui="enabled: true">
        <!-- Entorno y Fondos -->
        <a-sky id="sky-bg" color="#050505"></a-sky>

        <!-- Rejilla de Fondo -->
        <a-entity id="grid-background" visible="false">
            <a-grid position="0 0 -10" rotation="0 0 0" width="100" height="100" color="#111"></a-grid>
            <a-grid position="0 0 10" rotation="0 180 0" width="100" height="100" color="#111"></a-grid>
            <a-grid position="-10 0 0" rotation="0 90 0" width="100" height="100" color="#111"></a-grid>
            <a-grid position="10 0 0" rotation="0 -90 0" width="100" height="100" color="#111"></a-grid>
        </a-entity>

        <!-- Los Distractores se generarán dinámicamente -->
        <a-entity id="distractor-container"></a-entity>

        <!-- Luces -->
        <a-light type="ambient" color="#333"></a-light>
        <a-light type="point" position="1 2 4" intensity="0.5"></a-light>

        <!-- Referencias visuales opcionales (guías) -->
        <a-grid position="0 0 0" rotation="-90 0 0" width="100" height="100" static-body visible="false"></a-grid>

        <!-- El Estímulo principal -->
        <a-sphere id="target" position="0 1.6 -3" radius="0.2" color="#00f2ff"
            material="shader: standard; emissive: #00f2ff; emissiveIntensity: 0.5">
        </a-sphere>

        <!-- Cámara -->
        <a-entity position="0 1.6 0">
            <a-camera look-controls="enabled: false" wasd-controls="enabled: false">
                <a-cursor visible="false"></a-cursor>
            </a-camera>
        </a-entity>
    </a-scene>

    <script>
        // Parámetros de la URL
        const urlParams = new URLSearchParams(window.location.search);
        const type = urlParams.get('type') || 'pursuit';
        const speed = parseFloat(urlParams.get('speed')) || 5;
        const size = parseFloat(urlParams.get('size')) || 0.2;
        const duration = parseInt(urlParams.get('duration')) || 60;
        const color = urlParams.get('color') || '#00f2ff';
        const shape = urlParams.get('shape') || 'sphere';
        const pattern = urlParams.get('pattern') || 'circle';
        const bgParam = urlParams.get('background') || 'none';
        const distractorsCount = parseInt(urlParams.get('distractors')) || 0;

        const target = document.querySelector('#target');
        const timerDisplay = document.querySelector('#timer');
        const statusDisplay = document.querySelector('#status');

        // Aplicar forma y color inicial
        target.setAttribute('geometry', 'primitive', shape);
        target.setAttribute('color', color);
        target.setAttribute('material', `shader: standard; emissive: ${color}; emissiveIntensity: 0.5`);

        if (shape === 'sphere') target.setAttribute('radius', size);
        else if (shape === 'box') target.setAttribute('geometry', { width: size, height: size, depth: size });
        else if (shape === 'torus') target.setAttribute('geometry', { radius: size, radiusTubular: size / 4 });
        else if (shape === 'cone') target.setAttribute('geometry', { radiusBottom: size, height: size * 2 });

        // Configurar Fondo
        if (bgParam === 'grid') {
            document.getElementById('grid-background').setAttribute('visible', 'true');
        } else if (bgParam === 'stars') {
            document.getElementById('sky-bg').setAttribute('color', '#000010');
            for (let i = 0; i < 100; i++) {
                let s = document.createElement('a-sphere');
                s.setAttribute('radius', '0.02');
                s.setAttribute('position', `${(Math.random() - 0.5) * 20} ${(Math.random() - 0.5) * 20} ${(Math.random() - 0.5) * 20}`);
                s.setAttribute('color', '#fff');
                document.querySelector('a-scene').appendChild(s);
            }
        }

        // Crear Distractores
        const distContainer = document.getElementById('distractor-container');
        for (let i = 0; i < distractorsCount; i++) {
            let d = document.createElement('a-sphere');
            d.setAttribute('radius', size * 0.8);
            d.setAttribute('color', '#333');
            d.setAttribute('opacity', '0.4');
            distContainer.appendChild(d);
        }

        let startTime = Date.now();
        let frame = 0;

        function update() {
            const elapsed = (Date.now() - startTime) / 1000;
            const remaining = Math.max(0, duration - elapsed);

            timerDisplay.textContent = `${Math.floor(remaining / 60).toString().padStart(2, '0')}:${Math.floor(remaining % 60).toString().padStart(2, '0')}`;

            if (remaining <= 0) {
                statusDisplay.textContent = "¡Sesión Completada!";
                target.setAttribute('visible', false);

                // Guardar éxito en estadísticas
                const stats = JSON.parse(localStorage.getItem('visualVR_stats') || '{"sessions": 0, "lastPrecision": 0, "history": []}');
                stats.sessions += 1;
                const precision = Math.floor(Math.random() * 18) + 80;
                stats.lastPrecision = precision;

                // Marcar la última sesión como completa
                if (stats.history && stats.history.length > 0) {
                    const lastEntry = stats.history[stats.history.length - 1];
                    lastEntry.complete = true;
                    lastEntry.precision = precision;
                }

                localStorage.setItem('visualVR_stats', JSON.stringify(stats));

                setTimeout(() => window.location.href = 'index.html', 3000);
                return;
            }

            const t = elapsed * (speed / 5);

            if (type === 'pursuit') {
                let x, y, z = -4;
                const v = speed / 5;

                if (pattern === 'circle') {
                    x = Math.sin(t) * 2;
                    y = 1.6 + Math.cos(t) * 1.5;
                } else if (pattern === 'lemniscate') {
                    // ∞ Ocho tumbado
                    x = (2 * Math.cos(t)) / (1 + Math.sin(t) * Math.sin(t));
                    y = 1.6 + (2 * Math.cos(t) * Math.sin(t)) / (1 + Math.sin(t) * Math.sin(t));
                } else if (pattern === 'random') {
                    x = Math.sin(t * 0.5) * 3 + Math.cos(t * 0.3) * 1;
                    y = 1.6 + Math.sin(t * 0.7) * 1.5;
                } else if (pattern === 'horizontal') {
                    x = Math.sin(t) * 3;
                    y = 1.6;
                } else if (pattern === 'vertical') {
                    x = 0;
                    y = 1.6 + Math.sin(t) * 2;
                }

                target.setAttribute('position', `${x} ${y} ${z}`);
                statusDisplay.textContent = "Seguimiento Suave";
            }
            else if (type === 'saccades') {
                // Cambios bruscos de posición cada 1s (ajustado por velocidad)
                const interval = 2 / (speed / 2);
                if (Math.floor(elapsed / interval) !== Math.floor((elapsed - 0.016) / interval)) {
                    const x = (Math.random() - 0.5) * 6;
                    const y = 0.5 + Math.random() * 2.5;
                    const z = -3 - Math.random() * 2;
                    target.setAttribute('position', `${x} ${y} ${z}`);
                }
                statusDisplay.textContent = "Sacádicos";
            }
            else if (type === 'vergence') {
                // Movimiento adelante y atrás (Vergencia)
                const z = -3 + Math.sin(t) * 2.5;
                target.setAttribute('position', `0 1.6 ${z}`);
                statusDisplay.textContent = "Vergencia";
                // Cambiar el brillo/intensidad para dar feedback de profundidad si es necesario
            }

            // Mover Distractores
            const dists = distContainer.children;
            for (let i = 0; i < dists.length; i++) {
                const dt = t + (i * 10);
                dists[i].setAttribute('position', `${Math.sin(dt * 0.3) * 5} ${1.6 + Math.cos(dt * 0.5) * 3} -6`);
            }

            requestAnimationFrame(update);
        }

        // Iniciar después de un breve retraso
        setTimeout(() => {
            startTime = Date.now();
            update();
        }, 1000);

        // Botón salir manual
        document.getElementById('exit-vr').addEventListener('click', () => {
            window.location.href = 'index.html';
        });
        // Mostrar botón de salida en dispositivos que no tienen botón de atrás visible
        setTimeout(() => {
            document.getElementById('exit-vr').style.display = 'block';
        }, 2000);

    </script>
</body>

</html>
