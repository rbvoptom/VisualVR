<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>VisualVR - Sesión de Entrenamiento</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <style>
        #overlay {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 999;
            color: white;
            font-family: 'Outfit', sans-serif;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 10px;
            pointer-events: none;
        }

        .exit-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 999;
            background: rgba(255, 0, 0, 0.6);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            display: none;
        }
    </style>
</head>

<body>
    <div id="overlay">
        <div id="status">Iniciando...</div>
        <div id="timer">00:00</div>
    </div>

    <button class="exit-btn" id="exit-vr">SALIR</button>

    <a-scene xr-mode-ui="enabled: true" device-orientation-permission-ui="enabled: true">
        <!-- Entorno -->
        <a-sky color="#050505"></a-sky>

        <!-- Luces -->
        <a-light type="ambient" color="#333"></a-light>
        <a-light type="point" position="1 2 4" intensity="0.5"></a-light>

        <!-- Referencias visuales opcionales (guías) -->
        <a-grid position="0 0 0" rotation="-90 0 0" width="100" height="100" static-body visible="false"></a-grid>

        <!-- El Estímulo principal -->
        <a-sphere id="target" position="0 1.6 -3" radius="0.2" color="#00f2ff"
            material="shader: standard; emissive: #00f2ff; emissiveIntensity: 0.5">
        </a-sphere>

        <!-- Cámara -->
        <a-entity position="0 1.6 0">
            <a-camera look-controls="enabled: false" wasd-controls="enabled: false">
                <a-cursor visible="false"></a-cursor>
            </a-camera>
        </a-entity>
    </a-scene>

    <script>
        // Parámetros de la URL
        const urlParams = new URLSearchParams(window.location.search);
        const type = urlParams.get('type') || 'pursuit';
        const speed = parseFloat(urlParams.get('speed')) || 5;
        const size = parseFloat(urlParams.get('size')) || 0.2;
        const duration = parseInt(urlParams.get('duration')) || 60;

        const target = document.querySelector('#target');
        const timerDisplay = document.querySelector('#timer');
        const statusDisplay = document.querySelector('#status');

        target.setAttribute('radius', size);

        let startTime = Date.now();
        let frame = 0;

        function update() {
            const elapsed = (Date.now() - startTime) / 1000;
            const remaining = Math.max(0, duration - elapsed);

            timerDisplay.textContent = `${Math.floor(remaining / 60).toString().padStart(2, '0')}:${Math.floor(remaining % 60).toString().padStart(2, '0')}`;

            if (remaining <= 0) {
                statusDisplay.textContent = "¡Sesión Completada!";
                target.setAttribute('visible', false);
                setTimeout(() => window.location.href = 'index.html', 3000);
                return;
            }

            const t = elapsed * (speed / 5);

            if (type === 'pursuit') {
                // Movimiento circular suave
                const x = Math.sin(t) * 2;
                const y = 1.6 + Math.cos(t * 0.7) * 1.5;
                const z = -4;
                target.setAttribute('position', `${x} ${y} ${z}`);
                statusDisplay.textContent = "Seguimiento Suave";
            }
            else if (type === 'saccades') {
                // Cambios bruscos de posición cada 1s (ajustado por velocidad)
                const interval = 2 / (speed / 2);
                if (Math.floor(elapsed / interval) !== Math.floor((elapsed - 0.016) / interval)) {
                    const x = (Math.random() - 0.5) * 6;
                    const y = 0.5 + Math.random() * 2.5;
                    const z = -3 - Math.random() * 2;
                    target.setAttribute('position', `${x} ${y} ${z}`);
                }
                statusDisplay.textContent = "Sacádicos";
            }
            else if (type === 'vergence') {
                // Movimiento adelante y atrás (Vergencia)
                const z = -3 + Math.sin(t) * 2.5;
                target.setAttribute('position', `0 1.6 ${z}`);
                statusDisplay.textContent = "Vergencia";
                // Cambiar color para dar feedback de profundidad
                const blue = 255;
                const red = Math.abs(z) < 1 ? 255 : 0;
                target.setAttribute('color', `rgb(${red}, 242, ${blue})`);
            }

            requestAnimationFrame(update);
        }

        // Iniciar después de un breve retraso
        setTimeout(() => {
            startTime = Date.now();
            update();
        }, 1000);

        // Botón salir manual
        document.getElementById('exit-vr').addEventListener('click', () => {
            window.location.href = 'index.html';
        });
        // Mostrar botón de salida en dispositivos que no tienen botón de atrás visible
        setTimeout(() => {
            document.getElementById('exit-vr').style.display = 'block';
        }, 2000);

    </script>
</body>

</html>
