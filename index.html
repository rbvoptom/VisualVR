<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VisualVR - Entrenamiento Visual Avanzado</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>

<body>
    <div class="background-animation"></div>

    <main class="container">
        <header>
            <div class="logo">
                <span class="logo-icon">👁️‍🗨️</span>
                <h1>Visual<span>VR</span></h1>
            </div>
            <p class="subtitle">Terapia Visual en Realidad Virtual de Próxima Generación</p>
        </header>

        <section class="dashboard">
            <div class="glass-card main-controls">
                <h2>Configuración de Sesión</h2>
                <div class="control-group">
                    <label for="exercise-type">Tipo de Ejercicio</label>
                    <select id="exercise-type">
                        <option value="pursuit">Seguimiento Suave (Smooth Pursuit)</option>
                        <option value="saccades">Sacádicos (Saccades)</option>
                        <option value="vergence">Vergencia (Vergence)</option>
                    </select>
                </div>

                <div class="control-grid">
                    <div class="control-item">
                        <label for="speed">Velocidad</label>
                        <input type="range" id="speed" min="1" max="10" value="5">
                        <span class="value-display" id="speed-val">5</span>
                    </div>
                    <div class="control-item">
                        <label for="size">Tamaño</label>
                        <input type="range" id="size" min="0.1" max="2" step="0.1" value="0.5">
                        <span class="value-display" id="size-val">0.5</span>
                    </div>
                    <div class="control-item">
                        <label for="color">Color del Estímulo</label>
                        <select id="color">
                            <option value="#00f2ff">Cian Neón</option>
                            <option value="#ff00c8">Rosa Eléctrico</option>
                            <option value="#7000ff">Violeta Profundo</option>
                            <option value="#00ff00">Verde Terapia</option>
                            <option value="#ffff00">Amarillo Foveal</option>
                        </select>
                    </div>
                    <div class="control-item">
                        <label for="shape">Forma</label>
                        <select id="shape">
                            <option value="sphere">Esfera</option>
                            <option value="box">Cubo</option>
                            <option value="torus">Anillo</option>
                            <option value="cone">Puntero</option>
                        </select>
                    </div>
                    <div class="control-item">
                        <label for="pattern">Trayectoria (Pursuit)</label>
                        <select id="pattern">
                            <option value="circle">Círculo</option>
                            <option value="lemniscate">Ocho Tumbado (∞)</option>
                            <option value="random">Aleatoria Fluida</option>
                            <option value="horizontal">Horizontal</option>
                            <option value="vertical">Vertical</option>
                        </select>
                    </div>
                    <div class="control-item">
                        <label for="background">Entorno</label>
                        <select id="background">
                            <option value="none">Negro Puro</option>
                            <option value="grid">Rejilla de Contraste</option>
                            <option value="stars">Campo de Estrellas</option>
                        </select>
                    </div>
                    <div class="control-item">
                        <label for="distractors">Distractores Periféricos</label>
                        <select id="distractors">
                            <option value="0">Desactivados</option>
                            <option value="1">Baja Densidad</option>
                            <option value="3">Alta Densidad</option>
                        </select>
                    </div>
                    <div class="control-item">
                        <label for="duration">Duración (seg)</label>
                        <input type="number" id="duration" value="60" min="10">
                    </div>
                </div>

                <button id="start-btn" class="primary-btn">INICIAR ENTRENAMIENTO VR</button>
            </div>

            <div class="stats-panel">
                <div class="glass-card stat-card">
                    <h3>Última Sesión</h3>
                    <p class="stat-value">85%</p>
                    <p class="stat-label">Precisión de Seguimiento</p>
                </div>
                <div class="glass-card stat-card">
                    <h3>Sesiones Hoy</h3>
                    <p class="stat-value">3 / 5</p>
                    <p class="stat-label">Progreso Diario</p>
                </div>
            </div>
        </section>

        <footer>
            <p>&copy; 2025 Poveda Óptica & Audiología - Innovación en Salud Visual</p>
        </footer>
    </main>

    <script src="script.js"></script>
</body>

</html>
